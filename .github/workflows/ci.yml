name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Clang Release build + ctest (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed clang cmake ninja git

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: false

      # Only the submodules wired into CMake are fetched; extern/freeBOOT is not needed.
      - name: Fetch GxCrypt and spdlog submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive --depth 1 extern/GxCrypt extern/spdlog

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # gxbuild3_flashimage_tests and gxbuild3_keyvault_crypto_tests skip themselves
      # (exit 77) when their private fixtures are absent, as they are in CI.
      # gxbuild3_cli_integration_tests requires a Windows drive path, so it is excluded here.
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure -j"$(nproc)"
          -E gxbuild3_cli_integration_tests
